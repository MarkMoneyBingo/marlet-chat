name: marlet-build

on:
  push:
    branches: [marlet]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/markmoneybingo/marlet-chat/marlet-mattermost

jobs:
  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install webapp deps
        working-directory: webapp
        run: npm ci --no-audit --no-fund
      - name: Type-check webapp
        working-directory: webapp
        run: npm run check-types
      - name: Build webapp (Marlet branding)
        working-directory: webapp
        run: npm run build
      - name: Upload webapp dist
        uses: actions/upload-artifact@v4
        with:
          name: marlet-webapp-dist
          path: webapp/channels/dist
          retention-days: 7

  docker:
    needs: webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download webapp dist
        uses: actions/download-artifact@v4
        with:
          name: marlet-webapp-dist
          path: docker/marlet/dist
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/marlet
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
